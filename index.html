<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MORE2BFIT – Welkom</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2EDE3;--card:#fff;--tx:#4A473F;--hd:#2A2925;--ac:#F58220;--ac2:#C9762E;--ok:#2E9D5C;--okbg:#E4F4EA;--off:#7d786c;--offbg:#E8E2D6;--line:#d9d2c3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2A2925;--card:#34322d;--tx:#e6e1d6;--hd:#fff;--ok:#6FCF97;--okbg:#1f3a2a;--off:#b5afa2;--offbg:#3d3a33;--line:#4a473f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2A2925;--card:#34322d;--tx:#e6e1d6;--hd:#fff;--ok:#6FCF97;--okbg:#1f3a2a;--off:#b5afa2;--offbg:#3d3a33;--line:#4a473f;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 'Montserrat',system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 110px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.logo{font-weight:800;font-size:22px;letter-spacing:.5px;color:var(--hd)}.logo b{color:var(--ac)}.o{color:var(--ac)}
.lang{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:none;color:var(--tx);font:700 13px 'Montserrat',system-ui,sans-serif;padding:7px 11px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ac);color:#fff}
h1{font-weight:800;font-size:28px;line-height:1.2;margin:0 0 6px;color:var(--hd)}
.sub{margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
h2{font-weight:800;font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ac2);margin:0 0 10px}
.status{display:flex;gap:14px;align-items:center;border-width:2px}
.status.on{background:var(--okbg);border-color:var(--ok)}.status.off{background:var(--offbg);border-color:var(--off)}
.dot{flex:none;width:16px;height:16px;border-radius:50%;background:var(--off)}
.on .dot{background:var(--ok);animation:p 2s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(46,157,92,.5)}100%{box-shadow:0 0 0 14px rgba(46,157,92,0)}}
@media (prefers-reduced-motion:reduce){.on .dot{animation:none}}
.st-t{font-weight:800;font-size:19px;color:var(--hd);line-height:1.25}
.st-s{font-size:14px;margin-top:2px}
.st-s strong{font-weight:800;color:var(--hd)}
.live{font-size:11px;letter-spacing:.8px;text-transform:uppercase;font-weight:700;color:var(--off);margin-bottom:2px}
.on .live{color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;color:var(--hd)}
ul{margin:0;padding:0;list-style:none}
li{padding:9px 0 9px 26px;position:relative;border-bottom:1px solid var(--line)}li:last-child{border:0}
li::before{content:"";position:absolute;left:4px;top:17px;width:9px;height:9px;border-radius:50%;background:var(--ac)}
.price{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.price:last-child{border:0}
.price b{font-size:20px;color:var(--hd);white-space:nowrap}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;font-weight:800;border-radius:12px;padding:14px 18px;margin-top:12px;color:#fff;background:var(--ac)}
.btn.alt{background:transparent;color:var(--hd);border:2px solid var(--ac)}
.wa-btn{background:#25D366;color:#073b1b}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;background:#25D366;color:#073b1b;text-decoration:none;font-weight:800;padding:14px 20px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.28)}
svg{width:22px;height:22px;fill:currentColor}
footer{text-align:center;font-size:13px;line-height:1.8;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
footer strong{color:var(--hd)}
footer a{color:var(--ac2);font-weight:700;text-decoration:none}
footer #terms{margin-top:6px}
footer .copy{margin-top:6px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo">MORE<b>2B</b>FIT</div>
  <div class="lang" role="group" aria-label="Taal / Sprache / Language">
    <button data-l="nl">NL</button><button data-l="de">DE</button><button data-l="en">EN</button>
  </div>
</header>

<h1 data-t="h1"></h1>
<p class="sub" data-t="sub"></p>

<div id="status" class="card status" role="status" aria-live="polite">
  <div class="dot"></div>
  <div><div class="live" data-t="live"></div><div class="st-t" id="stT"></div><div class="st-s" id="stS"></div></div>
</div>

<div class="card"><h2 data-t="offerH"></h2><div class="chips"><span>Personal Training</span><span>Fitness</span><span data-t="swim"></span><span>Padel</span></div></div>

<div class="card"><h2 data-t="rulesH"></h2><ul id="rules"></ul></div>

<div class="card"><h2 data-t="priceH"></h2>
  <div class="price"><span data-t="single"></span><b>€ 9,50</b></div>
  <div class="price"><span data-t="ten"></span><b>€ 75,00</b></div>
</div>

<div class="card"><h2 data-t="locH"></h2>
  <div><strong style="color:var(--hd);font-weight:800">MORE2BFIT</strong><br>De Kamp 5<br>5855 EG Well</div>
  <a class="btn alt" href="https://www.google.com/maps/search/?api=1&query=De+Kamp+5+5855+EG+Well+Netherlands" target="_blank" rel="noopener" data-t="route"></a>
</div>

<div class="card"><h2 data-t="contactH"></h2>
  <div data-t="contactP"></div>
  <a class="btn wa-btn" id="waMain" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.1c-.2.6-1.300 1.200-1.800 1.200-.5.1-1 .2-3.300-.7a11.300 11.300 0 0 1-4.700-4.100c-.4-.5-1.200-1.600-1.200-3s.7-2.100 1-2.400c.2-.3.500-.3.700-.3h.5c.2 0 .4 0 .6.500l.8 2c.1.200.1.300 0 .5l-.3.500-.4.400c-.1.200-.3.300-.1.600.2.300.8 1.300 1.700 2 1.100 1 2.100 1.300 2.400 1.400.3.100.5.100.6-.1l.9-1.100c.2-.3.400-.2.600-.1l1.900.9c.3.100.5.200.5.300.1.200.1.800-.1 1.400z"/></svg><span data-t="wa"></span></a>
</div>

<footer>
  <div><strong>MORE2BFIT</strong><br>De Kamp 5, 5855 EG Well<br><a href="tel:+31478503411">0478-503411</a><br><a href="mailto:info@more2bfit.nl">info@more2bfit.nl</a><br><a href="https://www.more2bfit.nl" target="_blank" rel="noopener">www.more2bfit.nl</a></div>
  <div id="terms" hidden><a id="termsA" target="_blank" rel="noopener" data-t="terms"></a></div>
  <div class="copy">© <strong>MORE2BFIT</strong></div>
</footer>
</div>

<a class="fab" id="waFab" target="_blank" rel="noopener" aria-label="WhatsApp"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.1c-.2.6-1.300 1.200-1.800 1.200-.5.1-1 .2-3.300-.7a11.300 11.300 0 0 1-4.700-4.100c-.4-.5-1.200-1.600-1.200-3s.7-2.100 1-2.400c.2-.3.500-.3.700-.3h.5c.2 0 .4 0 .6.500l.8 2c.1.200.1.300 0 .5l-.3.500-.4.400c-.1.200-.3.300-.1.600.2.300.8 1.300 1.700 2 1.100 1 2.100 1.300 2.400 1.400.3.100.5.100.6-.1l.9-1.100c.2-.3.400-.2.600-.1l1.900.9c.3.100.5.200.5.300.1.200.1.800-.1 1.400z"/></svg>WhatsApp</a>

<script>
/* ===== BEGELEIDING: weekrooster (tijden in Nederlandse tijd) =====
   Index 0 = zondag … 6 = zaterdag. Per dag: [[start, einde], …] in "uu:mm".
   Actuele bemande tijden. */
var SCHED={0:[["09:00","12:00"]],1:[["09:30","13:00"],["16:00","19:30"]],2:[["09:30","13:00"],["16:00","21:00"]],3:[["09:30","13:00"],["16:00","21:00"]],4:[["09:30","13:00"],["16:00","21:00"]],5:[["09:30","13:00"]],6:[]};
/* ===== ZIEKTE / AFWEZIGHEID =====
   Zet hier de datums (JJJJ-MM-DD) waarop er GEEN personeel is, bijvoorbeeld ["2026-11-19"].
   De pagina toont dan de hele dag 'Members only' en slaat die dag over bij 'weer aanwezig'.
   Verlopen datums doen niets, dus opruimen hoeft niet. */
var NO_STAFF=[];
function gone(a,i){return NO_STAFF.indexOf(new Date(Date.UTC(a.y,a.mo-1,a.d+i)).toISOString().slice(0,10))>-1}
var TERMS_URL="https://www.more2bfit.nl/algemene-voorwaarden/"; /* link naar de algemene voorwaarden; zolang leeg is de link verborgen */
var WA="31478503411";

var T={
nl:{h1:"Welkom bij MORE2BFIT",sub:"De sportschool voor jou in Well. Hier vind je alles voor je bezoek.",live:"Live status",on:"Begeleiding aanwezig",off:"Members only",onS:"Er is nu iemand van ons team aanwezig tot {t} uur.",offS:"Ons personeel is weer aanwezig <strong>{d} om {t} uur</strong>.",offN:"Momenteel alleen toegankelijk voor leden.",offerH:"Ons aanbod",swim:"Zwemmen",rulesH:"Huisregels",rules:["Minimale leeftijd: 16 jaar","Sportkleding en handdoek verplicht","Bellen is niet toegestaan in de zaal","Houd toestellen niet onnodig bezet"],priceH:"Bezoekerstarieven",single:"Losse entree",ten:"10-rittenkaart",locH:"Adres",route:"Route openen",contactH:"Vragen?",contactP:"Stuur ons direct een bericht via WhatsApp.",wa:"WhatsApp ons",msg:"Hallo MORE2BFIT, ik heb een vraag.",terms:"Algemene voorwaarden",days:["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"],today:"vandaag",tomorrow:"morgen"},
de:{h1:"Willkommen bei MORE2BFIT",sub:"Das Fitnessstudio für dich in Well. Hier finden Sie alles für Ihren Besuch.",live:"Live-Status",on:"Betreuung vor Ort",off:"Members only",onS:"Jemand aus unserem Team ist jetzt bis {t} Uhr anwesend.",offS:"Unser Team ist wieder da: <strong>{d} um {t} Uhr</strong>.",offN:"Momentan nur für Mitglieder zugänglich.",offerH:"Unser Angebot",swim:"Schwimmen",rulesH:"Hausordnung",rules:["Mindestalter: 16 Jahre","Sportkleidung und Handtuch sind Pflicht","Telefonieren im Trainingsraum ist nicht erlaubt","Geräte nicht unnötig besetzt halten"],priceH:"Besucherpreise",single:"Einzeleintritt",ten:"10er-Karte",locH:"Adresse",route:"Route öffnen",contactH:"Fragen?",contactP:"Schreiben Sie uns direkt über WhatsApp.",wa:"Schreiben Sie uns per WhatsApp",msg:"Hallo MORE2BFIT, ich habe eine Frage.",terms:"Allgemeine Geschäftsbedingungen",days:["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"],today:"heute",tomorrow:"morgen"},
en:{h1:"Welcome to MORE2BFIT",sub:"The gym for you in Well. Everything you need for your visit.",live:"Live status",on:"Staff on site",off:"Members only",onS:"A member of our team is here until {t}.",offS:"Our staff is back: <strong>{d} at {t}</strong>.",offN:"Currently accessible to members only.",offerH:"What we offer",swim:"Swimming",rulesH:"House rules",rules:["Minimum age: 16 years","Sportswear and towel required","No phone calls in the gym area","Please don’t occupy equipment unnecessarily"],priceH:"Visitor rates",single:"Single entry",ten:"10-visit pass",locH:"Address",route:"Open route",contactH:"Questions?",contactP:"Send us a message on WhatsApp right away.",wa:"WhatsApp us",msg:"Hello MORE2BFIT, I have a question.",terms:"Terms and conditions",days:["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],today:"today",tomorrow:"tomorrow"}
};
var lang="nl";
try{var s=localStorage.getItem("m2bf-lang");if(T[s])lang=s;else{var n=(navigator.language||"nl").slice(0,2);if(T[n])lang=n}}catch(e){var n2=(navigator.language||"nl").slice(0,2);if(T[n2])lang=n2}

function mins(h){var p=h.split(":");return +p[0]*60+ +p[1]}
function ams(){
  var p=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Amsterdam",weekday:"short",year:"numeric",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());
  var g=function(t){return p.filter(function(x){return x.type===t})[0].value};
  return{wd:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(g("weekday")),m:+g("hour")*60+ +g("minute"),y:+g("year"),mo:+g("month"),d:+g("day")};
}
function status(){
  var a=ams(),i,j,seg;
  seg=gone(a,0)?[]:(SCHED[a.wd]||[]);
  for(j=0;j<seg.length;j++)if(a.m>=mins(seg[j][0])&&a.m<mins(seg[j][1]))return{on:true,t:seg[j][1]};
  for(i=0;i<8;i++){var d=(a.wd+i)%7;seg=gone(a,i)?[]:(SCHED[d]||[]);
    for(j=0;j<seg.length;j++)if(i>0||mins(seg[j][0])>a.m)return{on:false,d:d,i:i,t:seg[j][0]};}
  return{on:false};
}
function render(){
  var L=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(function(el){var v=L[el.getAttribute("data-t")];if(typeof v==="string")el.textContent=v});
  document.getElementById("rules").innerHTML=L.rules.map(function(r){return"<li>"+r+"</li>"}).join("");
  document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-l")===lang)});
  var url="https://wa.me/"+WA+"?text="+encodeURIComponent(L.msg);
  document.getElementById("waMain").href=url;document.getElementById("waFab").href=url;
  var tw=document.getElementById("terms");if(TERMS_URL){tw.hidden=false;document.getElementById("termsA").href=TERMS_URL}else{tw.hidden=true}
  var st=status(),box=document.getElementById("status");
  box.className="card status "+(st.on?"on":"off");
  document.getElementById("stT").textContent=st.on?L.on:L.off;
  var sub;
  if(st.on)sub=L.onS.replace("{t}",st.t);
  else if(st.t){var dn=st.i===0?L.today:st.i===1?L.tomorrow:L.days[st.d];sub=L.offN+" "+L.offS.replace("{d}",dn).replace("{t}",st.t)}
  else sub=L.offN;
  document.getElementById("stS").innerHTML=sub;
}
document.querySelectorAll(".lang button").forEach(function(b){b.addEventListener("click",function(){lang=b.getAttribute("data-l");try{localStorage.setItem("m2bf-lang",lang)}catch(e){}render()})});
render();setInterval(render,30000);
</script>
</body>
</html>
